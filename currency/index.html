<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SWAGH Job Finder</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
padding:20px;
}

.container{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.form-box{
background:white;
padding:35px;
border-radius:12px;
width:100%;
max-width:420px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:25px;
}

label{
font-size:14px;
font-weight:600;
}

input{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:18px;
border-radius:6px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:14px;
background:#ff6159;
border:none;
color:white;
font-weight:bold;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#e24d45;
}

/* Mobile spacing */

@media (max-width:480px){

.form-box{
padding:25px;
}

h2{
font-size:20px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="form-box">

<h2>SWAGH Job Finder</h2>

<form action="https://waghshudip.app.n8n.cloud/webhook-test/form-sumit
"
method="POST"
enctype="multipart/form-data">

<label>Your Name *</label>
<input type="text" name="Your Name" required>

<label>Email Id *</label>
<input type="email" name="Email Id" required>

<label>Profile you are looking for *</label>
<input type="text" name="Profile you are looking for?" placeholder="QA Lead, QA Manager">

<label>CV *</label>
<input type="file" name="CV" required>

<label>Years of Experience *</label>
<input type="number" name="Years of Experience" required>

<label>LinkedIn Profile</label>
<input type="text" name="LinkedIn Profile">

<label>Preferred Location *</label>
<input type="text" name="Preferred Location" placeholder="Pune, Mumbai, UAE">

<!-- Country Detection -->
<input type="hidden" name="country_code" id="country_code">

<button type="submit">
Find Matching Jobs
</button>

</form>

</div>

</div>


<script>

fetch("https://ipapi.co/json/")
.then(res=>res.json())
.then(data=>{
document.getElementById("country_code").value=data.country_code;
});

</script>

</body>
</html>
