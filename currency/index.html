<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SWAGH Job Finder</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
padding:30px 15px;
}

.container{
display:flex;
justify-content:center;
}

.form-box{
background:white;
padding:30px;
border-radius:16px;
width:100%;
max-width:420px;
box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

h2{
text-align:center;
margin-bottom:30px;
font-size:26px;
}

label{
font-size:14px;
font-weight:600;
}

input{
width:100%;
padding:14px;
margin-top:6px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #ddd;
font-size:15px;
}

button{
width:100%;
padding:16px;
background:#ff6159;
border:none;
color:white;
font-weight:bold;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#e24d45;
}

/* Loader */

#loading{
display:none;
text-align:center;
margin-top:10px;
}

.spinner{
border:4px solid #f3f3f3;
border-top:4px solid #ff6159;
border-radius:50%;
width:35px;
height:35px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.loading-text{
margin-top:10px;
font-size:14px;
color:#555;
}

/* Mobile */

@media (max-width:480px){

body{
padding:25px 12px;
}

.form-box{
padding:24px;
}

h2{
font-size:22px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="form-box">

<h2>SWAGH Job Finder</h2>

<form id="jobForm"
action="https://waghshudip.app.n8n.cloud/webhook/form-sumit"
method="POST"
enctype="multipart/form-data">

<label>Your Name *</label>
<input type="text" name="Your Name" required>

<label>Email Id *</label>
<input type="email" name="Email Id" required>

<label>Profile you are looking for *</label>
<input type="text" name="Profile you are looking for?" placeholder="QA Lead, QA Manager">

<label>CV *</label>
<input type="file" name="CV" required>

<label>Years of Experience *</label>
<input type="number" name="Years of Experience" required>

<label>LinkedIn Profile</label>
<input type="text" name="LinkedIn Profile">

<label>Preferred Location *</label>
<input type="text" name="Preferred Location" placeholder="Pune, Mumbai, UAE">

<!-- Country Detection -->
<input type="hidden" name="country_code" id="country_code">

<button type="submit" id="submitBtn">
Find Matching Jobs
</button>

</form>

<!-- Loader -->
<div id="loading">
<div class="spinner"></div>
<div class="loading-text">Preparing your payment link...</div>
</div>

</div>

</div>


<script>

/* Detect country */

fetch("https://ipapi.co/json/")
.then(res=>res.json())
.then(data=>{
document.getElementById("country_code").value=data.country_code;
});


/* Loader on form submit */

document.getElementById("jobForm").addEventListener("submit",function(){

document.getElementById("submitBtn").style.display="none";
document.getElementById("loading").style.display="block";

});

</script>

</body>
</html>
